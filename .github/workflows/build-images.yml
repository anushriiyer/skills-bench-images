name: build-task-images

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Space-separated task names to build (empty = all in tasks.json)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.pick.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          WANT: ${{ inputs.tasks }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          all_tasks = json.load(open("tasks.json"))
          want = os.environ.get("WANT", "").split()
          tasks = [t for t in all_tasks if not want or t in want]
          print("tasks=" + json.dumps(tasks))
          EOF

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        task: ${{ fromJson(needs.matrix.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.task }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/skillsbench-${{ matrix.task }}:latest
